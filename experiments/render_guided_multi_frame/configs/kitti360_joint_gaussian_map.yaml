base_config: kitti360_sequence.yaml

sequence:
  frames: null
  start: 2433
  end: 2463
  step: 2
  output_dir: experiments/render_guided_multi_frame/outputs/kitti360_2433_2463_joint_gaussian_map

gaussian_map:
  enabled: true
  window_frames: 5
  observation_stride: 4
  max_samples_per_frame: 30000
  max_new_gaussians_per_frame: 20000
  max_active_gaussians: 100000
  association_distance: 0.2
  voxel_size: 0.2
  color_distance: 0.25
  min_probability: 0.6
  min_confidence: 0.1
  initial_opacity: 0.5
  initial_scale_multiplier: 4.0
  freeze_when_missing: true
  checkpoint_interval: 5
  optimization:
    backend: cuda
    device: cuda
    iterations: 30
    downsample: 2
    rgb_weight: 1.0
    depth_weight: 0.2
    coverage_weight: 0.05
    track_weight: 0.05
    xyz_prior_weight: 0.001
    scale_prior_weight: 0.001
    min_optimization_alpha: 0.01
    learning_rates:
      xyz: 0.0002
      colors: 0.01
      log_scales: 0.002
      rotations: 0.001
      opacity_logits: 0.01
