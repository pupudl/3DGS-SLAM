# One-way LK with descriptors sampled at the actual tracked endpoints.
# Select sequence and frame range through run_sequence.py, as with the baseline.
base_config: kitti360_sequence.yaml

tracking:
  matcher: lk_descriptor
  flow:
    max_tracks: 4096
    window_size: 15
    max_level: 2
    max_iterations: 30
    epsilon: 0.01
    min_eigenvalue: 0.0001
    max_error: 60.0
    descriptor_min_similarity: 0.7

# Per-frame surface completion is enabled only for this LK experiment.
# Targets grow from measured cores and remain a soft ownership loss.
object_window:
  region_completion:
    enabled: true
    weight: 0.1
    min_initial_probability: 0.1
    max_distance_m: 3.0
    max_core_span_m: 8.0
    cost_max: 1.0
    min_weight: 0.15
    background_margin: 0.15
    competitor_margin: 0.15
    min_color_affinity: 0.05
    color_path_weight: 2.0
