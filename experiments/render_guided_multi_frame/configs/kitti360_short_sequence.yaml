base_config: ../render_guided_two_frame/configs/kitti360_full_feedback_four_pairs_hybrid_gray_recovery_unexplained.yaml

features:
  match_depth_min_m: 1.0
  match_depth_max_m: 60.0

sequence:
  frames: [2463, 2465, 2467, 2469]
  output_dir: experiments/render_guided_multi_frame/outputs/kitti360_2463_2469_object_window

tracking:
  catalog_keypoints: 4096
  join_radius_px: 1.5
  prior_weight: 0.25

object_render:
  silhouette_threshold: 0.05
  visibility_alpha_threshold: 0.05
  visibility_candidate_pixel_budget: 1000000

object_window:
  enabled: true
  window_frames: 5
  temperature: 0.25
  prior_weight: 0.05
  prior_floor: 0.001
  max_cost: 3.0
  max_fit_cost: 1.0
  min_probability: 0.6
  min_margin: 0.1
  height:
    enabled: true
    weight: 0.15
    above_camera_m: 2.0
    ground_min_m: -0.2
    soft_margin_m: 0.3
    feature_min_reliability: 0.5
  connectivity:
    enabled: true
    weight: 0.08
    seed_weight: 0.03
    update_interval: 5
  render:
    enabled: true
    iterations: 30
    learning_rate: 0.08
    downsample: 2
    rgb_weight: 1.0
    depth_weight: 0.2
    coverage_weight: 0.1
    centre_weight: 0.05
    prior_weight: 0.005
    entropy_weight: 0.0
    min_branch_probability: 0.01
