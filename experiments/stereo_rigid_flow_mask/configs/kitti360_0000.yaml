# Edit only frames.first and frames.second for a different temporal pair.
dataset:
  type: kitti360
  data_root: data/kitti360
  sequence: 2013_05_28_drive_0000_sync

frames:
  first: 2318
  second: 2320

depth:
  # Choose `sgbm` for OpenCV SGBM at run time, or `precomputed_igev` to read
  # <sequence>/depth_sceneflow/<first-frame>.npy generated by IGEV-Stereo.
  source: precomputed_igev
  precomputed_igev_subdir: depth_sceneflow

sky_mask:
  # Existing masks are reused. Missing ones are generated and cached through
  # lsgslam_windows when the MMSeg config and checkpoint below exist.
  mode: precomputed_or_generate
  directory: sky_masks
  device: cuda
  class_id: 10
  mmseg_config: checkpoints/mmseg/segformer_mit-b4_8xb1-160k_cityscapes-1024x1024.py
  mmseg_checkpoint: checkpoints/mmseg/segformer_mit-b4_8xb1-160k_cityscapes-1024x1024.pth

stereo:
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  min_depth_m: 1.0
  max_depth_m: 80.0

sparse_flow:
  max_corners: 12000
  quality_level: 0.01
  min_distance: 5.0
  window_size: 21
  max_level: 3
  forward_backward_threshold_px: 1.0

dynamic:
  # A point is dynamic if LK differs from GT-pose projection by more than this.
  residual_threshold_px: 3.0
  splat_radius_px: 4
  min_component_area_px: 50

# The script appends <sequence>_<first>_<second>_<depth-source> automatically.
output_dir: experiments/stereo_rigid_flow_mask/outputs
